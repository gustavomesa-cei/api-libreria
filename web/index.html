<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>El Gamer Pro</title>
    <link rel='stylesheet' href='css/main.css'>
    <script src='js/main.js' defer></script>
</head>

<body>
    <header>
        <h1>LLama a la API-Libreria</h1>
    </header>
    <main>
        <section class='api-calls'>
            <div class='api-call-header'>
                <h2>Get a /books</h2>
                <button id='btn-call1'>Hacer llamada</button>
            </div>
            <div class='api-response' id='api-calls1'></div>
        </section>
        <section class='api-calls'>
            <div class='api-call-header'>
                <h2>Post a /books</h2>
                <button id='btn-call2'>Hacer llamada</button>
            </div>
            <div class='api-call-inputs'>
                <label for='titulo'>Título:</label>
                <input type='text' id='titulo' name='titulo'>
                <label for='autor'>Autor:</label>
                <input type='text' id='autor' name='autor'>
                <label for='anio'>Año:</label>
                <input type='number' id='anio' name='anio'>
            </div>
            <div class='api-response' id='api-calls2'></div>
        </section>
        <section class='api-calls'>
            <div class='api-call-header'>
                <h2>Put a /books/{id}</h2>
                <button id='btn-call3'>Hacer llamada</button>
            </div>
            <div class='api-call-inputs'>
                <label for='id_edit'>ID:</label>
                <input type='number' id='id_edit' name='id'>
                <label for='anio_edit'>Año:</label>
                <input type='number' id='anio_edit' name='anio'>
            </div>
            <div class='api-response' id='api-calls3'></div>
        </section>
        <section class='api-calls'>
            <div class='api-call-header'>
                <h2>Get a /usuarios/{usuario_id}</h2>
                <button id='btn-call4'>Hacer llamada</button>
            </div>
            <div class='api-call-inputs'>
                <label for='usuario_id'>ID del usuario:</label>
                <input type='text' id='usuario_id' name='usuario_id'>
            </div>
            <div class='api-response' id='api-calls4'></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Mis llamadas a la API. Todos los derechos reservados.</p>
    </footer>
</body>

</html>
